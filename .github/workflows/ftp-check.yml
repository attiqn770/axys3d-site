# Manual check: lists the folders the FTP account sees, to confirm where the site is uploaded.
# Actions > Check FTP folders > Run workflow. Changes nothing on the server.
name: Check FTP folders
on: workflow_dispatch
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List folders over FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
          lftp --env-password -u "$FTP_USERNAME" "${FTP_SERVER#ftp://}" <<'LFTP'
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set ftp:prefer-epsv no
          echo "== start folder =="
          pwd
          cls -la
          echo "== public_html (first 15) =="
          cls -1 public_html | head -15
          echo "== domains =="
          cls -la domains
          echo "== domains/axys3d.com =="
          cls -la domains/axys3d.com
          bye
          LFTP
