# PUBLISH: every save in the editor (Pages CMS) is a commit on "main"; this workflow then
#   1. prepares uploaded pictures and films (tools/process-media.mjs) and saves the results back to the repo,
#   2. builds the site (npx astro build),
#   3. uploads dist/ to Hostinger by FTP.
# One-time setup (EDITING.md): repository secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# Optional repository variable FTP_PROTOCOL: "ftp" (default; Hostinger drops the FTPS data channel) or "ftps" for encrypted transfer on hosts that support it.
name: Publish the website

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab, to publish again without a change

# one publish at a time; a newer save waits for the running one instead of cancelling it half way
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # to save the prepared media back to the repository

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the site
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install ffmpeg (for films)
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          ffmpeg -version | head -1

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Prepare uploaded pictures and films
        run: node tools/process-media.mjs

      - name: Save prepared media back to the repository
        run: |
          git add -A public/media src/content src/data/tours tools/media-cache.json
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prepare uploaded media [skip ci]"
          # the owner may have saved again in the meantime: put this commit on top of theirs
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push --quiet origin HEAD:main && exit 0
            sleep 5
          done
          echo "Could not save the prepared media back (the site is still published from this run)." >&2

      - name: Build the site
        run: npx astro build

      # until the three FTP secrets are saved, the site is still built (so mistakes show up) but not uploaded
      - name: Check the Hostinger details are set
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Built, but not uploaded: add the FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets (see EDITING.md)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # lftp instead of FTP-Deploy-Action: Hostinger resets that tool's data connection on the first folder.
      # Only new or changed files are sent. Nothing on the server is deleted, so the mail settings
      # (public_html/mail/mail-config.php, git ignored) and the host's own folders are never touched.
      - name: Upload to Hostinger
        if: steps.ftp.outputs.ready == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftp' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
          SSL=no; [ "$FTP_PROTOCOL" = "ftps" ] && SSL=yes
          HOST="${FTP_SERVER#ftp://}"
          lftp --env-password -u "$FTP_USERNAME" "$HOST" <<LFTP
          set ftp:ssl-allow $SSL
          set ssl:verify-certificate no
          set ftp:passive-mode on
          set ftp:prefer-epsv no
          set net:timeout 30
          set net:max-retries 5
          set net:reconnect-interval-base 5
          mirror --reverse --only-newer --no-perms --parallel=3 --verbose=1 \
            --exclude-glob .git* --exclude-glob node_modules/ \
            --exclude-glob mail/mail-config.php --exclude-glob mail/logs/ \
            ./dist/ public_html/
          echo "== FTP start folder and its contents (to confirm where the site lives) =="
          pwd
          cls -1a
          echo "== domains =="
          cls -1a domains
          bye
          LFTP
